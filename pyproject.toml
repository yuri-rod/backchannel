[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backchannel"
version = "0.1.0"
description = "Read-live, write-back remote control for a local coding agent, from your phone."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yuri Barreira" }]
keywords = ["coding-agent", "remote-control", "ngrok", "tunnel", "devops", "self-hosted"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Chat",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/yuri-rod/backchannel"
Repository = "https://github.com/yuri-rod/backchannel"
Issues = "https://github.com/yuri-rod/backchannel/issues"
Security = "https://github.com/yuri-rod/backchannel/blob/main/SECURITY.md"

[project.scripts]
backchannel = "backchannel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
backchannel = ["web/*.html"]

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP", "B"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
# Assertions, fixed sample paths and a dummy token are what a test suite is.
"tests/*" = ["S101", "S105", "S108"]
